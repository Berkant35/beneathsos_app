name: beneathsos_app
description: BeneathSOS — estimate where a phone under rubble most likely is, as a probability map.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.4
  flutter: '>=3.47.0'

dependencies:
  ble_scanner:
    git:
      url: https://github.com/Berkant35/ble_scanner.git
      ref: v0.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  intl: ^0.20.3
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.0
  wakelock_plus: ^1.8.0

dev_dependencies:
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.5.0
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9

flutter:
  generate: true
  uses-material-design: true
