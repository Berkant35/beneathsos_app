name: beneathsos_app
description: BeneathSOS — estimate where a phone under rubble most likely is, as a probability map.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.4
  flutter: '>=3.47.0'

dependencies:
  audioplayers: ^6.8.1
  battery_plus: ^7.1.2
  ble_scanner:
    git:
      url: https://github.com/Berkant35/ble_scanner.git
      ref: v0.2.1
  beneathsos_ui:
    git:
      url: https://github.com/Berkant35/beneathsos_ui.git
      ref: v0.3.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  intl: ^0.20.3
  locator_engine:
    git:
      url: https://github.com/Berkant35/locator_engine.git
      ref: v0.1.2
  meta: ^1.17.0
  package_info_plus: ^10.2.2
  # Pinned: 13.x pulls permission_handler_android 14.x (compileSdk 37). AGP 9.1.0 looks for
  # platform 'android-37' but the SDK installs it as 'android-37.0'. See hub tasks/todo.md backlog.
  permission_handler: ^13.0.2
  riverpod_annotation: ^4.0.7
  rubble_core:
    git:
      url: https://github.com/Berkant35/rubble_core.git
      ref: v0.3.0
  rubble_canvas:
    git:
      url: https://github.com/Berkant35/rubble_canvas.git
      ref: v0.6.1
  sensors_plus: ^7.1.1
  wakelock_plus: ^1.8.0
  crypto: ^3.0.7
  share_plus: ^13.3.1

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.5.0
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/sounds/
